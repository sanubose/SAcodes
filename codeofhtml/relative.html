<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>realtive</title>
   <style>
    div{
        width: 200px;
        height: 200px;
        border-radius: 5px;
        text-align: center;
    }
    div:first-child{
        background-color: rgb(212, 127, 255);
    
    }
    div:nth-child(2){
        background-color: aquamarine;
        position: relative;
        left: 30px;
        top:30px;
        z-index: -1;
    }

    div:last-child{
        background-color: green;  
        

    }


   </style>
</head>
<body>
    <div>1</div>
    <div>2</div>
    <div>3</div>
</body>
</html>
