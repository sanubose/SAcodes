<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>object</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script&display=swap" rel="stylesheet">
    <style>

        *{
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            margin: 0;
            padding: 0;
            font-size: 10px;

        }
        /* body {
    background: linear-gradient(to bottom, #020024, #090979, #800080);
    height: 100vh;

    background-image: url('https://www.transparenttextures.com/patterns/stardust.png'); /* Star Effect 

} */
body {
    background: linear-gradient(to bottom, #000428, #004e92, #090979, #800080);
    height: 100vh;
    width: 100%;
    margin: 0;
    padding: 0;
    background-attachment: fixed;  /* Ensure Background Stays Fixed */
}


         h1{
            font-family: 'Dancing Script', cursive;
            font-size: 24px;
            font-style: italic;
            font-weight:900;
            margin-top:40px ;
            text-align: center;
            padding: 10px;
         }
         .container{
            width:1200px;
            height: auto;
            display:flex;
            margin:20px;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            align-items: center;
         }
         .planet {
            width: 350px;
            height: 400px;
            background-color: white;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            overflow: hidden;
            text-align: center;
            padding: 10px;
            /* background-color:#f0f9f8; */
            background: linear-gradient(to bottom, #020024, #090979, #800080);
            }

        
        .planet img{
            display: block;
            width:100%;
            height:300px;
            border-radius: 10px;
            object-fit: cover;
        }

        .planet p{
            font-family: 'Dancing Script', cursive;
            font-size: 24px;
            font-style: italic;
            font-weight: 600;
            margin-top:20px ;
        }


        /* Responsive Design for Mobile */
@media (max-width: 768px) {
    .container {
        flex-direction: column;
        align-items: center;
    }

    .planet {
        width: 90%;
        max-width: 300px;
    }

    h1 {
        font-size: 20px;
    }

    .planet p {
        font-size: 18px;
    }
}

    </style>

</head>
<body> 
         <h1>Our Planets! 🌞 🌙</h1>
     <div class="container">

            <P>Pluto</P>
        </div>
        <div class="planet"><img src="https://cdn.mos.cms.futurecdn.net/4or9Sj42y8dHuA8khBB8DK-1200-80.jpg" alt="SUN">
