<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Premium Chatbot with Voice Assistant</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #1a2980, #26d0ce);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #chat-container {
      width: 95%;
      max-width: 600px;
      height: 90vh;
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(15px);
      border-radius: 20px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }

    #chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    #user-input {
      display: flex;
      flex-direction: column;
      border-top: 1px solid rgba(255, 255, 255, 0.2);
    }

    #input-row, #send-row, #button-row {
      display: flex;
      justify-content: center;
      padding: 10px;
    }

    input {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 20px;
      outline: none;
      background: rgba(255, 255, 255, 0.3);
      color: #fff;
      font-size: 1rem;
    }

    button {
      padding: 12px 20px;
      border: none;
      border-radius: 20px;
      color: #fff;
      cursor: pointer;
      font-size: 1rem;
      transition: background-color 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    #send-btn {
      background-color: #007bff;
      width: 100%;
    }

    #send-btn:hover {
      background-color: #0056b3;
    }

    #mic-btn, #stop-btn {
      width: 48%;
    }

    #mic-btn {
      background-color: #28a745;
    }

    #mic-btn:hover {
      background-color: #218838;
    }

    #stop-btn {
      background-color: #dc3545;
    }

    #stop-btn:hover {
      background-color: #c82333;
    }

    .message {
      margin: 8px 0;
      padding: 12px;
      border-radius: 20px;
      max-width: 75%;
      word-wrap: break-word;
    }

    .user {
      background-color: #007bff;
      color: white;
      align-self: flex-end;
    }

    .bot {
      background-color: #fff;
      color: #333;
      align-self: flex-start;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    .loading {
      font-style: italic;
      color: gray;
    }

    @media screen and (max-width: 480px) {
      #chat-container {
        height: 95vh;
      }

      input, button {
        padding: 10px;
        font-size: 0.9rem;
      }

      button {
        margin: 0 5px;
      }

      #chat-box {
        padding: 15px;
      }
    }
  </style>
</head>
<body>
  <div id="chat-container">
    <div id="chat-box"></div>
    <div id="user-input">
      <div id="input-row">
        <input id="input-field" type="text" placeholder="Type a message or use voice..." />
      </div>
      <div id="send-row">
        <button id="send-btn" onclick="sendMessage()">Send</button>
      </div>
      <div id="button-row">
        <button id="mic-btn" onclick="startVoiceRecognition()">
          <svg width="24" height="24" fill="#fff" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 15a4 4 0 0 0 4-4V7a4 4 0 1 0-8 0v4a4 4 0 0 0 4 4Zm7-4a1 1 0 1 0-2 0 5 5 0 1 1-10 0 1 1 0 1 0-2 0 7 7 0 0 0 6 6.93V23h2v-5.07a7 7 0 0 0 6-6.93Z"/></svg>
          Voice
        </button>
        <button id="stop-btn" onclick="stopAllActions()">
          <svg width="24" height="24" fill="#fff" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M6 6h12v12H6z"/></svg>
          Stop
        </button>
      </div>
    </div>
  </div>




  <script>
    const chatBox = document.getElementById('chat-box');
    const inputField = document.getElementById('input-field');
    const apiKey = "AIzaSyBgC6d63dbi1t0D1QvXNhELLvk6-a8qEiA"; 
    let recognition;
    let isSpeaking = false;
  
    function displayMessage(message, sender, isLoading = false) {
      const messageDiv = document.createElement('div');
      messageDiv.textContent = message;
      messageDiv.className = `message ${sender}`;
      if (isLoading) {
        messageDiv.classList.add("loading");
      }
      chatBox.appendChild(messageDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
    }
  
    async function sendMessage() {
      const userMessage = inputField.value.trim();
      if (!userMessage) return;
  
      displayMessage(userMessage, 'user');
      inputField.value = '';
  
      displayMessage("Thinking...", 'bot', true);
  
      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: [{ parts: [{ text: userMessage }] }] })
        });
  
        const data = await response.json();
        const loadingMessage = document.querySelector('.message.bot.loading');
  
        if (response.ok) {
          const botReply = data?.candidates?.[0]?.content?.parts?.[0]?.text || "I'm sorry, I couldn't understand that.";
          if (loadingMessage) loadingMessage.remove();
          displayMessage(botReply, 'bot');
          speakMessage(botReply);
        } else {
          loadingMessage.textContent = "Oops! Something went wrong.";
        }
      } catch (error) {
        console.error("Fetch Error:", error);
        document.querySelector('.message.bot.loading').textContent = "Network error, please try again.";
      }
    }
  
    function startVoiceRecognition() {
      recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
      recognition.lang = 'en-US';
      recognition.start();
  
      recognition.onresult = (event) => {
        const voiceInput = event.results[0][0].transcript;
        inputField.value = voiceInput;
        sendMessage();
      };
  
      recognition.onerror = () => {
        displayMessage("Voice recognition failed. Please try again.", 'bot');
      };
    }
  
    function speakMessage(text) {
      const speech = new SpeechSynthesisUtterance(text);
      window.speechSynthesis.speak(speech);
      isSpeaking = true;
    }
  
    function stopAllActions() {
      if (recognition) recognition.stop();
      if (isSpeaking) {
        window.speechSynthesis.cancel();
        isSpeaking = false;
      }
      displayMessage("Actions stopped.", 'bot');
    }
  
    inputField.addEventListener("keyup", function(event) {
      if (event.key === "Enter") {
        sendMessage();
      }
    });
  </script>
  
</body>
</html>
