<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>assignment11</title>
       <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        
         .container{
            width:1200px;
            height: auto;
            display:flex;
            margin:20px;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            align-items: center;
            background: linear-gradient(to bottom, #020024, #090979, #800080); 
         }

         div{
            width: 350px;
            height: 400px;
            background-color: white;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            overflow: hidden;
            text-align: center;
            padding: 10px;
             /* background-color:#f0f9f8;  */
             /* background: linear-gradient(to bottom, #020024, #090979, #800080);  */
         }

         .box{
            width: 350px;
            height: 400px;
            background-color: white;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            overflow: hidden;
            text-align: center;
            padding: 10px;
            background-color:#f0f9f8;
            /* background: linear-gradient(to bottom, #020024, #090979, #800080); */
         }

         .box img{
            display: block;
            width:100%;
            height:300px;
            border-radius: 10px;
            object-fit: cover;
        }

        .box p{
            font-family: 'Dancing Script', cursive;
            font-size: 24px;
            font-style: italic;
            font-weight: 600;
            margin-top:20px ;
        }
       </style>

</head>
<body>
      
     <div class="container">
        <div class="box">
            <img src="https://images.nationalgeographic.org/image/upload/t_edhub_resource_key_image/v1638882786/EducationHub/photos/sun-blasts-a-m66-flare.jpg" alt="sun">
                <p>SUN</p>
            </img>
        </div>
        <div class="box">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRO2swROvfSY8Tn_Ln1mGzAtCxrG6Ga0kNgzw&s" alt="earth">
                <p>EARTH</p>
            </img>
        </div>
        <div class="box">
            <img src="https://cdn.mos.cms.futurecdn.net/xXp45gLeBTBt4jPuZcawUJ-1200-80.jpg" alt="moon">
                <p>MOON</p>
            </img>
        </div>
     </div>


</body>
</html>
