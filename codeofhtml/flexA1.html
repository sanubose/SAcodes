<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flexbox</title>
    <style>
        .container{
            background-color: rgb(207, 7, 247);
            border: 5px solid black;
            width: 600px;
            height: 200px;
            display: flex;
            gap: 5px;
            /* /* flex-direction:row; 
            flex-wrap: wrap; */
            /* align-items:  baseline; */
            justify-content: space-between;
           
        }
        .box{
             width: 50px;
            height: 50px;
            margin: 2px; 
           
            border: 3px solid black;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="box" style="background-color: purple;  flex-grow: 5;">1</div>
        <div class="box" style="background-color: yellowgreen; flex-grow: 2;">2</div>
        <div  class="box" style="background-color: violet; order:-1">3</div>
        <div  class="box" style="background-color: aqua;">4</div>
        <!-- <div  class="box" style="background-color: orange;">5</div>
        <div  class="box" style="background-color: red;">6</div>
        <div class="box" style="background-color: rgba(177, 86, 177, 0.151);">7</div>
        <div  class="box" style="background-color: rgba(177, 35, 35, 0.322);">8</div> -->
    </div>
    
</body>
</html>
