<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Layout</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: black;
        }
        .container {
            display: flex;
            border: 2px solid white;
            padding: 20px;
            width: 700px;
            height: 400px;
        }
        .left-section {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 60%;
        }
        .box {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-evenly;
            align-items: center;
            border: 2px solid white;
            padding: 15px;
            height: 120px;
        }
        .circle {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid white;
        }
        .right-section {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 40%;
            padding: 20px;
            border: 2px solid white;
            margin: 15px 15px;
            gap:20px
        }
        .rectangle {
            height: 80px;
            border: 2px solid white;
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="left-section">
            <div class="box">
                <div class="circle"></div>
                <div class="circle"></div>
                <div class="circle"></div>
                <div class="circle"></div>
                <div class="circle"></div>
                <div class="circle"></div>
            </div>
            <div class="box">
                <div class="circle"></div>
                <div class="circle"></div>
                <div class="circle"></div>
                <div class="circle"></div>
                <div class="circle"></div>
                <div class="circle"></div>
            </div>
            <div class="box">
                <div class="circle"></div>
                <div class="circle"></div>
                <div class="circle"></div>
                <div class="circle"></div>
                <div class="circle"></div>
                <div class="circle"></div>
            </div>
        </div>
        <div class="right-section">
            <div class="rectangle"></div>
            <div class="rectangle"></div>
            <div class="rectangle"></div>
            <div class="rectangle"></div>
        </div>
    </div>
</body>
</html>
