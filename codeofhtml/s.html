<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Moneycontrol Clone</title>
  <style>
    /* General Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: #f9f9f9;
    }

    /* Header Section */
    header {
      background-color: #f1f1f1;
      padding: 10px 20px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .top-bar select, .top-bar input, .top-bar button {
      margin-left: 10px;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    .top-bar input {
      flex: 1;
      max-width: 400px;
    }

    .promo {
      background-color: #4B0082;
      color: white;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: bold;
    }

    .top-bar button {
      background-color: #007bff;
      color: white;
      cursor: pointer;
    }

    .top-bar button:hover {
      background-color: #0056b3;
    }

    /* Banner Section */
    .banner-section {
      display: flex;
      justify-content: space-between;
      margin-top: 20px;
    }

    .banner-section img {
      width: 300px;
      height: 100px;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <!-- Header Section -->
  <header>
    <div class="top-bar">
      <button class="menu-btn">☰</button>
      <select>
        <option>English</option>
        <option>Hindi</option>
      </select>
      <button class="specials-btn">Specials</button>
      <span class="promo">₹50 LAKHS</span>
      <input type="text" placeholder="Search Quotes, News, Mutual Fund NAVs" />
      <button class="search-btn">🔍</button>
      <button class="alerts-btn">My Alerts</button>
      <button class="ad-free-btn" style="background-color: #ff9500;">Go Ad-Free</button>
      <button class="login-btn">Hello, Login</button>
    </div>
  </header>

  <!-- Banner Section -->
  <section class="banner-section">
    <img src="https://tpc.googlesyndication.com/simgad/18241203098825553913" alt="BSE Markets" />
    <img src="https://images.moneycontrol.com/images/common/headfoot/logo.png?impolicy=mchigh" alt="Moneycontrol Logo" />
    <img src="https://tpc.googlesyndication.com/simgad/8694860495481553409" alt="Ad Promotion" />
  </section>
</body>
</html>
