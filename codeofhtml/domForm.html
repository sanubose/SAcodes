<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get values from Select Tag</title>
</head>
<body>
    <select id="gender">
        <option value="select something">Select gender</option>
        <option value="male">Male</option>
        <option value="female">Female</option>
        <option value="others">Others</option>
    </select>
    <button onclick="selectedGender()">Submit</button>

    <script>
        function selectedGender() {
            let genderVal = document.getElementById("gender");
            console.log(genderVal.value);
        }
    </script>
</body>
</html>
