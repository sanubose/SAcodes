<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document object modal</title>
</head>
<body>
    <script>
        // Correctly using text-align to center the content
        document.write('<h1 style="color:red; text-align:center;">Welcome to my world</h1>');
        
        function ShowName(){
            var name = document.form1.name.value;
            alert("Welcome: " + name);
        }
    </script>
    
    <form name="form1">
     Enter your name: <input type="text" name="name" > <br/>
     <input type="button" value="Click Me!" onclick="ShowName()">
    </form>

    <script>
        document.writeln('<h3 style="color:green;">End the form now</h3>');
    </script>
</body>
</html>
