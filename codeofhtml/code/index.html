<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Image to Ghibli Style Converter</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;600&display=swap');

    body {
      font-family: 'SF Pro Display', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background-color: #f2f2f7;
      margin: 0;
    }
    h1 {
      color: #007aff;
      font-weight: 600;
    }
    .container {
      background-color: #fff;
      padding: 24px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      width: 90%;
      max-width: 480px;
      animation: fadeIn 1s ease-in-out;
    }
    input, button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      font-size: 16px;
      border-radius: 12px;
      border: none;
      outline: none;
    }
    input {
      background-color: #f2f2f7;
    }
    button {
      background-color: #007aff;
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    button:disabled {
      background-color: #d1d1d6;
    }
    button:hover:enabled {
      background-color: #005ecb;
    }
    img {
      margin-top: 20px;
      width: 100%;
      max-height: 400px;
      object-fit: cover;
      border-radius: 12px;
      border: 1px solid #e5e5ea;
    }
    .loader {
      display: none;
      margin-top: 20px;
      font-size: 16px;
      color: #007aff;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <h1>Image to Studio Ghibli Style Converter</h1>
  <div class="container">
    <input type="file" id="upload" accept="image/*" />
    <button id="convert">Convert to Ghibli Style</button>
    <p class="loader" id="loader">Processing... Please wait</p>
    <h3>Original Image</h3>
    <img id="original" src="" alt="Original Image" />
    <h3>Styled Image</h3>
    <img id="styled" src="" alt="Styled Image" />
  </div>

  <script>
    const uploadInput = document.getElementById('upload');
    const originalImage = document.getElementById('original');
    const styledImage = document.getElementById('styled');
    const convertButton = document.getElementById('convert');
    const loader = document.getElementById('loader');

    uploadInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function (e) {
          originalImage.src = e.target.result;
        };
        reader.readAsDataURL(file);
      }
    });

    convertButton.addEventListener('click', async () => {
      if (!uploadInput.files.length) {
        alert('Please upload an image first!');
        return;
      }

      loader.style.display = 'block';
      convertButton.disabled = true;

      const formData = new FormData();
      formData.append('image', uploadInput.files[0]);

      try {
        const response = await fetch('https://api.deepai.org/api/toonify', {
          method: 'POST',
          headers: { 'api-key': '2ad16df9-1cd2-4318-92ea-99b0daee795d' },
          body: formData,
        });

        if (!response.ok) {
          throw new Error('Failed to convert the image. Please try again.');
        }
        const result = await response.json();
        styledImage.src = result.output_url;
      } catch (error) {
        alert(error.message);
      } finally {
        loader.style.display = 'none';
        convertButton.disabled = false;
      }
    });
  </script>
</body>
</html>
