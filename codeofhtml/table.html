<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Single Border Table</title>
    <style>
        table {
            width: 50%;
            border-collapse: collapse;
            border: 1px solid black; /* Single outer border */
        }
        th, td {
            padding: 10px;
            text-align: center;
            border: none; /* No individual cell borders */
        }
    </style>
</head>
<body>

    <table>
        <tr>
            <th>Name</th>
            <th>Age</th>
            <th>City</th>
        </tr>
        <tr>
            <td>John</td>
            <td>25</td>
            <td>New York</td>
        </tr>
        <tr>
            <td>Sarah</td>
            <td>30</td>
            <td>Los Angeles</td>
        </tr>
        <tr>
            <td>Mike</td>
            <td>28</td>
            <td>Chicago</td>
        </tr>
    </table>

</body>
</html>
