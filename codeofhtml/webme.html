<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flexLayout</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            flex-direction: column;
            margin: 10px;
        }
        header {
            background-color: rgba(0, 128, 0, 0.338);
            display: flex;
            align-items: center;
        }
        a {
            text-decoration: none;
        }
        header ul {
            list-style: none;
            display: flex;
        }
        #logo {
            margin-left: auto;
            margin-right: auto;
        }
        #manu li {
            padding: 10px; /* Now this will apply */
        }
        #social-links li {
            padding: 10px;
        }
    </style>
</head>
<body>
   <header>
          <nav id="manu">
            <ul>
                <li><a href="#home">Home</a></li> <!-- Changed <il> to <li> -->
                <li><a href="#about-us">About Us</a></li> <!-- Changed <il> to <li> -->
                <li><a href="#contact">Contact</a></li> <!-- Changed <il> to <li> -->
            </ul>
          </nav>
          <div id="logo">
            <a href="">margrate</a>
          </div>
          <nav id="social-links">
            <ul>
                <li><a href=""><i class="fa-brands fa-facebook-f"></i></a></li>
                <li><a href=""><i class="fa-brands fa-twitter"></i></a></li>
                <li><a href=""><i class="fa-brands fa-google"></i></a></li>
            </ul>
          </nav>
   </header>
</body>
</html>
