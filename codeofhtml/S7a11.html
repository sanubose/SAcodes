<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Grid Layout</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f5f5f5;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 10px;
            width: 60%;
            max-width: 500px;
            padding: 10px;
            background-color: #222;
            justify-items: center;  /* Centers grid items horizontally */
            align-items: center;    /* Centers grid items vertically */
        }

        .item {
            padding: 20px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            color: white;
            border: 2px solid black;
        }

        .item:nth-child(1) { background-color: #ff5733; }
        .item:nth-child(2) { background-color: #33ff57; }
        .item:nth-child(3) { background-color: #3357ff; }
        .item:nth-child(4) { background-color: #ff33a1; }
        .item:nth-child(5) { background-color: #f4c542; }
        .item:nth-child(6) { background-color: #42f4e2; }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">Item 1</div>
        <div class="item">Item 2</div>
        <div class="item">Item 3</div>
        <div class="item">Item 4</div>
        <div class="item">Item 5</div>
        <div class="item">Item 6</div>
    </div>
</body>
</html>
