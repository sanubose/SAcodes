<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flexbox</title>
    <style>
        body{
            text-align: center;
            
        }
        #container{
            width: 500px;
            height: 800px;
            display: flex;
            flex-direction:row;
            flex-wrap: wrap;
            justify-content:center;
            align-content: flex-start;
        }
        div{
            height: 50px;
            width: 150px;
            border:2px solid black;
        }
    </style>
</head>
<body>
    <h1>flex box play ground</h1>
    <div id="container">

          <div id="box1" style="background-color: blue;" >box1</div>
         <div id="box2"  style="background-color: blueviolet; height:100px ; flex-grow: 2;">box2</div>
        <div id="box3"  style="background-color: red;">box3</div>
           <div id="box4" style="background-color: rgb(119, 255, 0);">box4</div>
          <div id="box5"  style="background-color: aqua;">box5</div>
    </div>
    
    
</body>
</html>
