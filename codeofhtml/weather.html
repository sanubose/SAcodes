<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather Forecast Dashboard</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem;
      min-height: 100vh;
    }

    .dashboard {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      backdrop-filter: blur(15px);
      padding: 2rem;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .dashboard h2 {
      text-align: center;
      font-size: 1.8rem;
      color: #ffffff;
    }

    .input-section {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .input-section input {
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 10px;
      outline: none;
    }

    .input-section button {
      padding: 0.5rem;
      border: none;
      border-radius: 10px;
      background: #ffffff;
      color: #764ba2;
      font-weight: bold;
      cursor: pointer;
    }

    .weather-card {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 15px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      box-shadow: inset 0 0 8px rgba(255, 255, 255, 0.1);
    }

    .weather-card span {
      font-size: 1rem;
      display: flex;
      justify-content: space-between;
    }

    #weatherChart {
      width: 100% !important;
      height: auto !important;
    }

    @media (max-width: 600px) {
      .dashboard {
        padding: 1.5rem;
        width: 90%;
      }

      .dashboard h2 {
        font-size: 1.5rem;
      }

      .weather-card span {
        font-size: 0.95rem;
      }
    }
  </style>
</head>
<body>
  <div class="dashboard">
    <h2>🌦️ Weather Forecast</h2>
    <div class="input-section">
      <input type="text" id="cityInput" placeholder="Enter city name">
      <button onclick="getWeather()">Get Weather</button>
    </div>
    <div class="weather-card">
      <span><strong>Date & Time:</strong> <span id="dateTime">--</span></span>
      <span><strong>Temperature:</strong> <span id="temperature">-- °C</span></span>
      <span><strong>Humidity:</strong> <span id="humidity">-- %</span></span>
      <span><strong>Wind Speed:</strong> <span id="windSpeed">-- km/h</span></span>
      <span><strong>Condition:</strong> <span id="condition">--</span></span>
    </div>
    <canvas id="weatherChart"></canvas>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    document.getElementById('dateTime').textContent = new Date().toLocaleString();

    function getWeather() {
      const city = document.getElementById('cityInput').value.trim();
      if (!city) return alert('Please enter a city name');

      // Dummy data update for demo
      document.getElementById('temperature').textContent = '28 °C';
      document.getElementById('humidity').textContent = '60%';
      document.getElementById('windSpeed').textContent = '10 km/h';
      document.getElementById('condition').textContent = `Sunny in ${city}`;
      document.getElementById('dateTime').textContent = new Date().toLocaleString();
    }

    const ctx = document.getElementById('weatherChart').getContext('2d');
    new Chart(ctx, {
      type: 'line',
      data: {
        labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'],
        datasets: [{
          label: 'Temperature °C',
          data: [22, 24, 25, 27, 26],
          borderColor: '#fff',
          backgroundColor: 'rgba(255, 255, 255, 0.1)',
          tension: 0.4,
          pointBackgroundColor: '#fff',
          pointRadius: 5
        }]
      },
      options: {
        responsive: true,
        plugins: {
          legend: { labels: { color: 'white' } }
        },
        scales: {
          x: { ticks: { color: 'white' }, grid: { color: 'rgba(255,255,255,0.1)' } },
          y: { ticks: { color: 'white' }, grid: { color: 'rgba(255,255,255,0.1)' } }
        }
      }
    });
  </script>
</body>
</html>
