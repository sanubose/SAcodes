<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BBMP eKatha Voice Assistant</title>
    <style>
        
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

body {
    background: url('assets/bg.jpg') no-repeat center center/cover;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.container {
    background: rgba(255, 255, 255, 0.9);
    padding: 25px;
    border-radius: 10px;
    box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
    text-align: center;
    max-width: 400px;
    width: 100%;
}

header img {
    width: 80px;
    margin-bottom: 10px;
}

h1 {
    font-size: 20px;
    color: #333;
}

.voice-btn {
    background: #ff9800;
    color: white;
    border: none;
    padding: 10px 15px;
    border-radius: 5px;
    font-size: 16px;
    cursor: pointer;
    margin: 15px 0;
    transition: 0.3s;
}

.voice-btn:hover {
    background: #e68900;
}

form {
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.input-group {
    text-align: left;
}

label {
    font-size: 14px;
    font-weight: 600;
}

input {
    width: 100%;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 5px;
    font-size: 14px;
}

.submit-btn {
    background: #007bff;
    color: white;
    border: none;
    padding: 10px;
    border-radius: 5px;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
}

.submit-btn:hover {
    background: #0056b3;
}

    </style>
</head>
<body>
    <div class="container">
        <header>
            <img src="assets/logo.png" alt="BBMP Logo">
            <h1>BBMP eKatha Voice Assistant</h1>
        </header>

        <button id="start-voice" class="voice-btn">🎙️ Start Voice Input</button>

        <form id="ekatha-form">
            <div class="input-group">
                <label for="name">Full Name:</label>
                <input type="text" id="name" placeholder="Enter your full name" required>
            </div>

            <div class="input-group">
                <label for="address">Address:</label>
                <input type="text" id="address" placeholder="Enter your complete address" required>
            </div>

            <div class="input-group">
                <label for="phone">Phone Number:</label>
                <input type="text" id="phone" placeholder="Enter your phone number" required>
            </div>

            <button type="submit" class="submit-btn">Submit</button>
        </form>
    </div>

    <script src="server.js"></script>
    <script>

document.getElementById('start-voice').addEventListener('click', () => {
    const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
    recognition.lang = 'en-IN';

    recognition.onresult = (event) => {
        const voiceInput = event.results[0][0].transcript;
        const words = voiceInput.split(" ");

        if (words.length >= 3) {
            document.getElementById('name').value = words[0] + " " + words[1];
            document.getElementById('address').value = words.slice(2, -1).join(" ");
            document.getElementById('phone').value = words[words.length - 1];
        }
    };

    recognition.start();
});

document.getElementById('ekatha-form').addEventListener('submit', (event) => {
    event.preventDefault();

    const formData = {
        name: document.getElementById('name').value,
        address: document.getElementById('address').value,
        phone: document.getElementById('phone').value,
    };

    fetch('http://localhost:3000/submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(formData),
    })
    .then(response => response.json())
    .then(data => alert(data.message))
    .catch(error => console.error('Error:', error));
});
             
    </script>
</body>
</html>
