<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flexclass</title>
    <style>
        
        #papa{
            display: flex;
            justify-content:center;
        }
           
        #papa  div:nth-child(2) {
            background-color: aquamarine;
        }
        #papa div{
            background-color: blue;
            width: 100px;
            height: 100px;
            
            
        }
        #papa :nth-last-child(3){
            background-color: blueviolet;
        }
    </style>
</head>
<body>
   
    <div id="papa">
       <div>1</div>
       <div>2</div>
       <div>3</div>
       
    </div>

    
</body>
</html>
